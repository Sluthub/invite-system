version: 2
updates:
  - package-ecosystem: npm
    directory: /app/static
    schedule:
      interval: daily
      time: "04:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    rebase-strategy: auto
    commit-message:
      prefix: "[chore] deps"
    cooldown:
      default-days: 1
