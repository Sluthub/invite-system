# .github/workflows/i18n-template.yml
name: refresh-pot
on:
  schedule:
    - cron: '13 03 * * *'   # once a night
  workflow_dispatch: {}      # manual run

permissions:
  contents: read

jobs:
  pot:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # Publish templates only from the default branch, excluding Weblate updates.
    if: >-
      github.actor != 'weblate' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml 

      - name: Re-generate POT template
        run: |
          PYTHONPATH=. uv run pybabel extract -F babel.cfg -k _l -o messages.pot .
          if ! git diff --quiet messages.pot; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add messages.pot
            git commit -m "i18n: refresh POT template [skip ci]"
            git push
          fi
