# .github/workflows/i18n-template.yml
name: refresh-pot
on:
  schedule:
    - cron: '13 03 * * *'   # once a night
  workflow_dispatch: {}      # manual run

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-24.04
    permissions: {}
    if: >-
      github.actor != 'weblate' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    outputs:
      publish: ${{ steps.branch.outputs.publish }}
    steps:
      - name: Check the exact default branch
        id: branch
        shell: bash
        env:
          ACTUAL_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # Git refs are case-sensitive; GitHub expression equality is not.
        run: |
          if [[ "$ACTUAL_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  pot:
    needs: admission
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # Only the read-only admission job can authorize default-branch publication.
    if: needs.admission.result == 'success' && needs.admission.outputs.publish == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: pyproject.toml 

      - name: Re-generate POT template
        run: |
          PYTHONPATH=. uv run pybabel extract -F babel.cfg -k _l -o messages.pot .
          if ! git diff --quiet messages.pot; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add messages.pot
            git commit -m "i18n: refresh POT template [skip ci]"
            git push
          fi
