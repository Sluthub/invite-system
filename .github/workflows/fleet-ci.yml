name: Sluthub invitations CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sluthub-invitations-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FLASK_SKIP_SCHEDULER: 'true'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install locked Python dependencies
        run: uv sync --locked --dev
      - name: Check Python source
        run: uv run --locked --dev ruff check .
      - name: Install locked frontend dependencies
        working-directory: app/static
        run: npm ci
      - name: Build static frontend
        working-directory: app/static
        run: npm run build
      - name: Install Chromium for browser tests
        run: uv run --locked --dev playwright install --with-deps chromium
      - name: Run unit and browser tests
        run: uv run --locked --dev pytest
