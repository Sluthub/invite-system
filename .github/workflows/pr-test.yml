name: Pre-commit Tests

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-and-format:
    runs-on: ubuntu-24.04
    if: github.actor != 'weblate'
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'


    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-
      
    - name: Install dependencies
      run: uv sync --locked --dev

    - name: Check Python source
      run: uv run --locked --dev ruff check .
    - name: Check Python formatting
      run: uv run --locked --dev ruff format --check app/
    
    - name: Run djlint
      run: uv run --locked --dev djlint app/templates --check --profile=jinja
    
    - name: Run ty check
      run: |
        # Note: ty is pre-release software and may have false positives
        # Run type checking but don't fail the workflow on type errors
        uv run --locked --dev ty check app/ || echo "⚠️ Type checking found issues but continuing..."
        echo "✅ Type check completed (warnings/errors above are non-blocking)"
